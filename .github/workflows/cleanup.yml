name: 🧹 Cleanup Azure Resources

on:
  workflow_dispatch:
    inputs:
      delete_container_apps:
        description: 'Delete Container Apps'
        required: true
        type: boolean
        default: true
      delete_acr_images:
        description: 'Delete old ACR images (keep latest 3)'
        required: true
        type: boolean
        default: true
      delete_ai_search_index:
        description: 'Delete AI Search index'
        required: true
        type: boolean
        default: true
      delete_sql_data:
        description: 'Delete SQL database data (⚠️ Destructive)'
        required: true
        type: boolean
        default: true
      delete_storage:
        description: 'Delete Blob Storage documents'
        required: true
        type: boolean
        default: true
      delete_all_resources:
        description: '⚠️ DELETE ENTIRE RESOURCE GROUP (everything)'
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

env:
  AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP || 'azure-ai-agents' }}
  ACR_NAME: ${{ secrets.ACR_NAME || 'aiagentsacr' }}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Purge Soft-Deleted Resources
        if: ${{ github.event.inputs.delete_all_resources == 'true' }}
        run: |
          echo "🔥 Purging soft-deleted resources..."
          
          # Purge soft-deleted Cognitive Services (OpenAI)
          PURGE_ACCOUNTS=$(az cognitiveservices account list-deleted --query "[].{name: name, resourceGroup: resourceGroup, id: id}" -o json)
          
          echo "$PURGE_ACCOUNTS" | jq -r '.[] | select(.resourceGroup == "${{ env.AZURE_RESOURCE_GROUP }}") | .id' | while read ID; do
            if [ ! -z "$ID" ]; then
              echo "Purging soft-deleted resource: $ID"
              az cognitiveservices account purge --location westeurope --name ai-agents-openai --resource-group ${{ env.AZURE_RESOURCE_GROUP }} 2>/dev/null || echo "Purge initiated"
            fi
          done
          
          echo "✓ Soft-deleted resources purged"
          sleep 10

      - name: ⚠️ Delete Entire Resource Group
        if: ${{ github.event.inputs.delete_all_resources == 'true' }}
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "⚠️  DELETING ENTIRE RESOURCE GROUP"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "This will delete EVERYTHING in ${{ env.AZURE_RESOURCE_GROUP }}"
          echo "  • Container Apps"
          echo "  • Container Registry"
          echo "  • SQL Database & Server"
          echo "  • Azure OpenAI (purged)"
          echo "  • AI Search"
          echo "  • Blob Storage"
          echo ""
          
          az group delete \
            --name ${{ env.AZURE_RESOURCE_GROUP }} \
            --yes \
            --no-wait
          
          echo "✓ Resource group deletion initiated (async)"
          echo "  Monitor in Azure Portal to see when complete"
          exit 0

      - name: Delete Container Apps
        if: ${{ github.event.inputs.delete_container_apps == 'true' && github.event.inputs.delete_all_resources != 'true' }}
        run: |
          echo "🗑️ Deleting Container Apps..."
          
          for APP in orchestrator retriever ingestion; do
            if az containerapp show --name $APP --resource-group ${{ env.AZURE_RESOURCE_GROUP }} 2>/dev/null; then
              echo "Deleting $APP..."
              az containerapp delete \
                --name $APP \
                --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
                --yes
              echo "✓ $APP deleted"
            else
              echo "ℹ️ $APP not found (already deleted)"
            fi
          done

      - name: Delete Old ACR Images
        if: ${{ github.event.inputs.delete_acr_images == 'true' && github.event.inputs.delete_all_resources != 'true' }}
        run: |
          echo "🐳 Cleaning up old Docker images (keeping latest 3)..."
          
          for IMAGE_NAME in orchestrator retriever ingestion; do
            echo "Cleaning $IMAGE_NAME..."
            
            # Get all image tags sorted by creation time
            TAGS=$(az acr repository show-tags \
              --name ${{ env.ACR_NAME }} \
              --repository $IMAGE_NAME \
              --orderby time_desc \
              --output tsv 2>/dev/null || echo "")
            
            if [ -z "$TAGS" ]; then
              echo "ℹ️ No images found for $IMAGE_NAME"
              continue
            fi
            
            # Skip first 3 (latest), delete the rest
            echo "$TAGS" | tail -n +4 | while read TAG; do
              if [ ! -z "$TAG" ] && [ "$TAG" != "latest" ]; then
                echo "Deleting $IMAGE_NAME:$TAG..."
                az acr repository delete \
                  --name ${{ env.ACR_NAME }} \
                  --image $IMAGE_NAME:$TAG \
                  --yes 2>/dev/null || echo "Failed to delete $TAG"
              fi
            done
            
            echo "✓ $IMAGE_NAME cleanup complete"
          done

      - name: Delete AI Search Index
        if: ${{ github.event.inputs.delete_ai_search_index == 'true' && github.event.inputs.delete_all_resources != 'true' }}
        run: |
          echo "🔍 Deleting AI Search index..."
          
          SEARCH_NAME=$(az search service list --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query "[0].name" -o tsv)
          SEARCH_KEY=$(az search admin-key show --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --service-name $SEARCH_NAME --query primaryKey -o tsv)
          
          curl -X DELETE "https://${SEARCH_NAME}.search.windows.net/indexes/documents?api-version=2023-11-01" \
            -H "api-key: $SEARCH_KEY"
          
          echo "✓ AI Search index deleted"
          echo "⚠️ You'll need to re-run ingestion to recreate the index"

      - name: Delete SQL Database Data
        if: ${{ github.event.inputs.delete_sql_data == 'true' && github.event.inputs.delete_all_resources != 'true' }}
        run: |
          echo "🗄️ Deleting SQL database data..."
          
          SQL_SERVER=$(az sql server list --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query "[0].name" -o tsv)
          
          # Drop and recreate database (faster than DELETE statements)
          az sql db delete \
            --name geography_index \
            --server $SQL_SERVER \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --yes
          
          az sql db create \
            --name geography_index \
            --server $SQL_SERVER \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --edition Basic
          
          echo "✓ SQL database recreated (empty)"
          echo "⚠️ You'll need to re-run setup_azure_sql.py to repopulate"

      - name: Delete Blob Storage Documents
        if: ${{ github.event.inputs.delete_storage == 'true' && github.event.inputs.delete_all_resources != 'true' }}
        run: |
          echo "💾 Deleting Blob Storage documents..."
          
          STORAGE_NAME=$(az storage account list --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query "[0].name" -o tsv)
          
          az storage blob delete-batch \
            --account-name $STORAGE_NAME \
            --source documents \
            --auth-mode login
          
          echo "✓ All documents deleted from Blob Storage"

      - name: 🎉 Cleanup Summary
        if: ${{ github.event.inputs.delete_all_resources != 'true' }}
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ CLEANUP COMPLETED"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Deleted:"
          echo "  Container Apps: ${{ github.event.inputs.delete_container_apps }}"
          echo "  ACR Images: ${{ github.event.inputs.delete_acr_images }}"
          echo "  AI Search Index: ${{ github.event.inputs.delete_ai_search_index }}"
          echo "  SQL Data: ${{ github.event.inputs.delete_sql_data }}"
          echo "  Storage Documents: ${{ github.event.inputs.delete_storage }}"
          echo ""
          echo "Retained resources still incur costs. To delete everything:"
          echo "  Re-run with 'delete_all_resources' = true"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
