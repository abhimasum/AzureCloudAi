name: Deploy Azure MAF Agents

on:
  push:
    branches: [master]
    paths:
      - "agents/**"
      - "ingestion/**"
      - "infra/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      create_resources:
        description: "Create Azure resources if they don't exist?"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  AZURE_RESOURCE_GROUP: azure-ai-agents
  AZURE_LOCATION: westeurope
  ACR_NAME: aiagentsacr
  CONTAINER_ENV: ai-agents-env
  SQL_SERVER_NAME: ai-agents-sql
  SQL_DATABASE_NAME: geography_index
  OPENAI_NAME: ai-agents-openai
  SEARCH_NAME: ai-agents-search-abhimasum
  STORAGE_NAME: aiagentsstorageabhimasum
  RETRIEVER_PORT: 8081
  ORCHESTRATOR_PORT: 8002

jobs:
  provision-infrastructure:
    runs-on: ubuntu-latest
    outputs:
      acr_login_server: ${{ steps.infra.outputs.acr_login_server }}
      sql_server: ${{ steps.sql.outputs.sql_server }}
      openai_endpoint: ${{ steps.openai.outputs.endpoint }}
      openai_key: ${{ steps.openai.outputs.key }}
      search_endpoint: ${{ steps.search.outputs.endpoint }}
      search_key: ${{ steps.search.outputs.key }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Verify Azure Subscription and Permissions
        run: |
          echo "🔍 Verifying Azure subscription and permissions..."
          
          # FIRST: Set subscription explicitly if provided
          if [ ! -z "${{ env.AZURE_SUBSCRIPTION_ID }}" ]; then
            echo "Setting subscription to: ${{ env.AZURE_SUBSCRIPTION_ID }}"
            az account set --subscription "${{ env.AZURE_SUBSCRIPTION_ID }}" || {
              echo "❌ Failed to set subscription"
              exit 1
            }
          fi
          
          # Verify current subscription
          CURRENT_SUB=$(az account show --query id -o tsv)
          echo "Active Subscription: $CURRENT_SUB"
          
          # List all resource groups to verify access
          echo ""
          echo "Available Resource Groups:"
          az group list --query "[].name" -o table || {
            echo "⚠️ Could not list resource groups"
          }
          
          echo ""
          echo "✓ Subscription context verified"

      - name: Register Required Resource Providers
        run: |
          echo "📋 Registering required Azure resource providers..."
          
          PROVIDERS=(
            "Microsoft.Sql"
            "Microsoft.CognitiveServices"
            "Microsoft.Search"
            "Microsoft.Storage"
            "Microsoft.App"
            "Microsoft.ContainerRegistry"
            "Microsoft.OperationalInsights"
          )
          
          for provider in "${PROVIDERS[@]}"; do
            echo "Registering $provider..."
            az provider register --namespace "$provider" --accept-terms || echo "Already registered or no action needed"
          done
          
          echo ""
          echo "Waiting for provider registration (up to 2 minutes)..."
          sleep 120
          
          echo "✓ Resource providers registered"

      - name: Create Resource Group (Mandatory - First Step)
        run: |
          echo "📦 Creating/Verifying Resource Group: ${{ env.AZURE_RESOURCE_GROUP }}"
          echo "   Location: ${{ env.AZURE_LOCATION }}"
          echo "   Subscription: ${{ env.AZURE_SUBSCRIPTION_ID || 'default' }}"
          echo ""
          
          # Check if RG exists (use az group show, not az group exists)
          if az group show --name ${{ env.AZURE_RESOURCE_GROUP }} -o none 2>/dev/null; then
            echo "✓ Resource Group ${{ env.AZURE_RESOURCE_GROUP }} already exists"
          else
            echo "Resource Group does not exist, creating..."
            
            az group create \
              --name ${{ env.AZURE_RESOURCE_GROUP }} \
              --location ${{ env.AZURE_LOCATION }} || {
              echo "❌ Failed to create Resource Group"
              exit 1
            }
            
            echo "✓ Resource Group created successfully"
          fi
          
          # Final verification with retry (use az group show directly)
          echo ""
          echo "Verifying Resource Group is accessible..."
          MAX_RETRIES=5
          RETRY=0
          
          while [ $RETRY -lt $MAX_RETRIES ]; do
            if az group show --name ${{ env.AZURE_RESOURCE_GROUP }} -o none 2>/dev/null; then
              echo "✓ Resource Group verified and accessible"
              exit 0
            fi
            
            RETRY=$((RETRY + 1))
            if [ $RETRY -lt $MAX_RETRIES ]; then
              WAIT_TIME=$((5 + RETRY * 5))
              echo "⚠️ RG not yet accessible, retry $RETRY/$MAX_RETRIES (waiting ${WAIT_TIME}s)..."
              sleep $WAIT_TIME
            fi
          done
          
          echo "❌ Failed to verify Resource Group after $MAX_RETRIES attempts"
          exit 1

      - name: Check and Create Azure SQL Server
        id: sql
        run: |
          echo "🗄️ Checking Azure SQL Server: ${{ env.SQL_SERVER_NAME }}"
          
          # Wait for resource group to be fully ready
          sleep 5
          
          # Check if server exists
          if az sql server show --name ${{ env.SQL_SERVER_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} -o none 2>/dev/null; then
            echo "✓ SQL Server ${{ env.SQL_SERVER_NAME }} exists"
            echo "sql_server=${{ env.SQL_SERVER_NAME }}" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "Creating SQL Server ${{ env.SQL_SERVER_NAME }}..."
          
          # Create SQL Server with retry logic
          MAX_ATTEMPTS=3
          ATTEMPT=1
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Attempt $ATTEMPT of $MAX_ATTEMPTS..."
            
            az sql server create \
              --name ${{ env.SQL_SERVER_NAME }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --location ${{ env.AZURE_LOCATION }} \
              --admin-user sqladmin \
              --admin-password "${{ secrets.AZURE_SQL_PASSWORD }}" 2>&1
            
            if [ $? -eq 0 ]; then
              echo "✓ SQL Server created successfully"
              break
            fi
            
            if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
              echo "⚠️ Creation failed, retrying in 15 seconds..."
              sleep 15
            fi
            
            ATTEMPT=$((ATTEMPT + 1))
          done
          
          if [ $ATTEMPT -gt $MAX_ATTEMPTS ]; then
            echo "❌ Failed to create SQL Server after $MAX_ATTEMPTS attempts"
            exit 1
          fi
          
          # Add firewall rule
          echo "Adding firewall rule for Azure services..."
          az sql server firewall-rule create \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --server ${{ env.SQL_SERVER_NAME }} \
            --name AllowAzureServices \
            --start-ip-address 0.0.0.0 \
            --end-ip-address 0.0.0.0
          
          echo "sql_server=${{ env.SQL_SERVER_NAME }}" >> $GITHUB_OUTPUT
          echo "✓ SQL Server setup complete"

      - name: Check and Create SQL Database
        run: |
          echo "📊 Checking SQL Database: ${{ env.SQL_DATABASE_NAME }}"
          
          if az sql db show --name ${{ env.SQL_DATABASE_NAME }} --server ${{ steps.sql.outputs.sql_server }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} -o none 2>/dev/null; then
            echo "✓ Database ${{ env.SQL_DATABASE_NAME }} exists"
            exit 0
          fi
          
          echo "Creating database ${{ env.SQL_DATABASE_NAME }}..."
          
          MAX_ATTEMPTS=3
          ATTEMPT=1
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Attempt $ATTEMPT of $MAX_ATTEMPTS..."
            
            az sql db create \
              --name ${{ env.SQL_DATABASE_NAME }} \
              --server ${{ steps.sql.outputs.sql_server }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --edition GeneralPurpose \
              --compute-model Serverless \
              --family Gen5 \
              --capacity 2 \
              --auto-pause-delay 60 2>&1
            
            if [ $? -eq 0 ]; then
              echo "✓ Database created successfully"
              exit 0
            fi
            
            if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
              echo "⚠️ Creation failed, retrying in 10 seconds..."
              sleep 10
            fi
            
            ATTEMPT=$((ATTEMPT + 1))
          done
          
          echo "❌ Failed to create database after $MAX_ATTEMPTS attempts"
          exit 1

      - name: Purge Soft-Deleted OpenAI Resources
        run: |
          echo "🔥 Checking for soft-deleted OpenAI resources..."
          
          # Check if resource already exists (healthy state)
          if az cognitiveservices account show --name ${{ env.OPENAI_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} -o none 2>/dev/null; then
            echo "✓ Resource exists in healthy state, skipping purge"
            exit 0
          fi
          
          echo "Resource appears to be soft-deleted, initiating purge..."
          
          # Use REST API to purge soft-deleted resource
          TOKEN=$(az account get-access-token --query accessToken -o tsv)
          RESOURCE_ID="/subscriptions/${{ env.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ env.AZURE_RESOURCE_GROUP }}/providers/Microsoft.CognitiveServices/accounts/${{ env.OPENAI_NAME }}"
          
          echo "Purging via REST API: $RESOURCE_ID"
          
          # Attempt REST API purge
          curl -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            "https://management.azure.com${RESOURCE_ID}/purge?api-version=2017-12-01" 2>&1 || echo "REST purge attempt completed"
          
          # Also try CLI purge multiple times
          for i in {1..3}; do
            echo "CLI purge attempt $i of 3..."
            az cognitiveservices account purge \
              --name ${{ env.OPENAI_NAME }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --location ${{ env.AZURE_LOCATION }} 2>&1 || true
            sleep 20
          done
          
          echo "Waiting 60 seconds for purge to finalize..."
          sleep 60
          
          echo "✓ Purge sequence completed"

      - name: Check and Create Azure OpenAI
        id: openai
        run: |
          echo "🤖 Checking Azure OpenAI: ${{ env.OPENAI_NAME }}"
          
          if az cognitiveservices account show --name ${{ env.OPENAI_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} -o none 2>/dev/null; then
            echo "✓ Azure OpenAI ${{ env.OPENAI_NAME }} exists"
          else
            echo "Creating Azure OpenAI ${{ env.OPENAI_NAME }}..."
            
            MAX_ATTEMPTS=3
            ATTEMPT=1
            while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
              echo "Attempt $ATTEMPT of $MAX_ATTEMPTS..."
              
              # First attempt: try creating normally
              if [ $ATTEMPT -eq 1 ]; then
                az cognitiveservices account create \
                  --name ${{ env.OPENAI_NAME }} \
                  --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
                  --location ${{ env.AZURE_LOCATION }} \
                  --kind OpenAI \
                  --sku S0 2>&1 && break
              fi
              
              # Subsequent attempts: try with restore flag (for soft-deleted resources)
              if [ $ATTEMPT -gt 1 ]; then
                echo "Attempting with restore flag (soft-deleted resource recovery)..."
                az cognitiveservices account create \
                  --name ${{ env.OPENAI_NAME }} \
                  --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
                  --location ${{ env.AZURE_LOCATION }} \
                  --kind OpenAI \
                  --sku S0 \
                  --restore 2>&1 && break
              fi
              
              if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
                echo "⚠️ Attempt $ATTEMPT failed, waiting 30 seconds before retry..."
                sleep 30
              fi
              
              ATTEMPT=$((ATTEMPT + 1))
            done
            
            if [ $ATTEMPT -gt $MAX_ATTEMPTS ]; then
              echo "❌ Failed to create/restore Azure OpenAI after $MAX_ATTEMPTS attempts"
              exit 1
            fi
            
            echo "✓ Azure OpenAI created/restored successfully"
            sleep 10
          fi
          
          echo "Ensuring gpt-4o model deployment exists..."
          if ! az cognitiveservices account deployment show \
            --name ${{ env.OPENAI_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --deployment-name gpt-4o -o none 2>/dev/null; then
            az cognitiveservices account deployment create \
              --name ${{ env.OPENAI_NAME }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --deployment-name gpt-4o \
              --model-name gpt-4o \
              --model-version "2024-11-20" \
              --model-format OpenAI \
              --sku-capacity 3 \
              --sku-name GlobalStandard
          fi
          echo "✓ Azure OpenAI ready with GPT-4o deployment"
          
          echo "Fetching Azure OpenAI endpoint and key for downstream jobs..."
          OPENAI_ENDPOINT=$(az cognitiveservices account show --name ${{ env.OPENAI_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query properties.endpoint -o tsv)
          OPENAI_KEY=$(az cognitiveservices account keys list --name ${{ env.OPENAI_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query key1 -o tsv)
          echo "::add-mask::${OPENAI_KEY}"
          echo "endpoint=${OPENAI_ENDPOINT}" >> $GITHUB_OUTPUT
          echo "key=${OPENAI_KEY}" >> $GITHUB_OUTPUT

      - name: Check and Create AI Search
        id: search
        run: |
          echo "🔍 Checking Azure AI Search: ${{ env.SEARCH_NAME }}"
          
          if az search service show --name ${{ env.SEARCH_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} -o none 2>/dev/null; then
            echo "✓ AI Search ${{ env.SEARCH_NAME }} exists, reusing it"
          else
            echo "Creating AI Search ${{ env.SEARCH_NAME }}..."
            
            MAX_ATTEMPTS=2
            ATTEMPT=1
            CREATED=false
            while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
              echo "Attempt $ATTEMPT of $MAX_ATTEMPTS..."
              
              if az search service create \
                --name ${{ env.SEARCH_NAME }} \
                --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
                --location ${{ env.AZURE_LOCATION }} \
                --sku Basic 2>&1; then
                echo "✓ AI Search created"
                CREATED=true
                break
              fi
              
              # Creation may fail as "name already in use" if it actually belongs to
              # us (previous run created it, or it's still finishing provisioning).
              # Re-check ownership before treating this as a real failure.
              if az search service show --name ${{ env.SEARCH_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} -o none 2>/dev/null; then
                echo "✓ AI Search ${{ env.SEARCH_NAME }} already exists in our resource group, reusing it"
                CREATED=true
                break
              fi
              
              if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
                echo "⚠️ Creation failed, retrying in 15 seconds..."
                sleep 15
              fi
              
              ATTEMPT=$((ATTEMPT + 1))
            done
            
            if [ "$CREATED" != "true" ]; then
              echo "❌ Failed to create AI Search - the name '${{ env.SEARCH_NAME }}' may be taken by another subscription/tenant (search service names are globally unique)."
              exit 1
            fi
          fi
          
          echo "Fetching AI Search endpoint and admin key for downstream jobs..."
          SEARCH_ENDPOINT="https://${{ env.SEARCH_NAME }}.search.windows.net"
          SEARCH_KEY=$(az search admin-key show --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --service-name ${{ env.SEARCH_NAME }} --query primaryKey -o tsv)
          echo "::add-mask::${SEARCH_KEY}"
          echo "endpoint=${SEARCH_ENDPOINT}" >> $GITHUB_OUTPUT
          echo "key=${SEARCH_KEY}" >> $GITHUB_OUTPUT

      - name: Check and Create Storage Account
        run: |
          echo "💾 Checking Storage Account: ${{ env.STORAGE_NAME }}"
          
          if az storage account show --name ${{ env.STORAGE_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} -o none 2>/dev/null; then
            echo "✓ Storage Account ${{ env.STORAGE_NAME }} exists"
          else
            echo "Creating Storage Account ${{ env.STORAGE_NAME }}..."
            
            MAX_ATTEMPTS=2
            ATTEMPT=1
            CREATED=false
            while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
              echo "Attempt $ATTEMPT of $MAX_ATTEMPTS..."
              
              if az storage account create \
                --name ${{ env.STORAGE_NAME }} \
                --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
                --location ${{ env.AZURE_LOCATION }} \
                --sku Standard_LRS 2>&1; then
                echo "✓ Storage Account created"
                CREATED=true
                break
              fi
              
              # Creation may fail as "already taken" if it actually belongs to us
              # (previous run created it, or it's still finishing provisioning).
              if az storage account show --name ${{ env.STORAGE_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} -o none 2>/dev/null; then
                echo "✓ Storage Account ${{ env.STORAGE_NAME }} already exists in our resource group, reusing it"
                CREATED=true
                break
              fi
              
              if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
                echo "⚠️ Creation failed, retrying in 10 seconds..."
                sleep 10
              fi
              
              ATTEMPT=$((ATTEMPT + 1))
            done
            
            if [ "$CREATED" != "true" ]; then
              echo "❌ Failed to create Storage Account - the name '${{ env.STORAGE_NAME }}' may be taken by another subscription/tenant (storage account names are globally unique)."
              exit 1
            fi
          fi
          
          echo "Creating blob container..."
          STORAGE_CONN=$(az storage account show-connection-string --name ${{ env.STORAGE_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query connectionString -o tsv)
          
          az storage container create --name documents --connection-string "$STORAGE_CONN" 2>/dev/null || echo "✓ Container already exists"
          echo "✓ Storage Account ready"

      - name: Check and Create Container Registry
        id: infra
        run: |
          echo "📦 Checking Azure Container Registry..."
          
          if az acr show --name ${{ env.ACR_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} 2>/dev/null; then
            echo "✓ ACR ${{ env.ACR_NAME }} exists"
          else
            echo "Creating ACR ${{ env.ACR_NAME }}..."
            
            MAX_ATTEMPTS=2
            ATTEMPT=1
            while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
              echo "Attempt $ATTEMPT of $MAX_ATTEMPTS..."
              
              az acr create \
                --name ${{ env.ACR_NAME }} \
                --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
                --location ${{ env.AZURE_LOCATION }} \
                --sku Basic \
                --admin-enabled true 2>&1
              
              if [ $? -eq 0 ]; then
                echo "✓ ACR created"
                break
              fi
              
              if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
                echo "⚠️ Creation failed, retrying in 10 seconds..."
                sleep 10
              fi
              
              ATTEMPT=$((ATTEMPT + 1))
            done
            
            if [ $ATTEMPT -gt $MAX_ATTEMPTS ]; then
              echo "❌ Failed to create ACR"
              exit 1
            fi
          fi
          
          ACR_SERVER=$(az acr show --name ${{ env.ACR_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query loginServer -o tsv)
          echo "acr_login_server=${ACR_SERVER}" >> $GITHUB_OUTPUT
          echo "✓ ACR ready: $ACR_SERVER"

      - name: Check and Create Container Apps Environment
        run: |
          echo "🌐 Checking Container Apps Environment..."
          
          if az containerapp env show --name ${{ env.CONTAINER_ENV }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} 2>/dev/null; then
            echo "✓ Container Apps Environment ${{ env.CONTAINER_ENV }} exists"
            exit 0
          fi
          
          echo "Creating Container Apps Environment ${{ env.CONTAINER_ENV }}..."
          
          MAX_ATTEMPTS=2
          ATTEMPT=1
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Attempt $ATTEMPT of $MAX_ATTEMPTS..."
            
            az containerapp env create \
              --name ${{ env.CONTAINER_ENV }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --location ${{ env.AZURE_LOCATION }} 2>&1
            
            if [ $? -eq 0 ]; then
              echo "✓ Container Apps Environment created"
              exit 0
            fi
            
            if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
              echo "⚠️ Creation failed, retrying in 30 seconds..."
              sleep 30
            fi
            
            ATTEMPT=$((ATTEMPT + 1))
          done
          
          echo "❌ Failed to create Container Apps Environment"
          exit 1

      - name: 🎉 Infrastructure Provisioning Complete
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ INFRASTRUCTURE READY"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Resource Group: ${{ env.AZURE_RESOURCE_GROUP }}"
          echo "Location: ${{ env.AZURE_LOCATION }}"
          echo "SQL Server: ${{ steps.sql.outputs.sql_server }}"
          echo "ACR: ${{ steps.infra.outputs.acr_login_server }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

  setup-database:
    needs: provision-infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyodbc

      - name: Setup SQL Database Schema
        run: |
          echo "🗄️ Setting up SQL database schema..."
          python infra/setup_azure_sql.py
        env:
          AZURE_SQL_SERVER: ${{ env.SQL_SERVER_NAME }}.database.windows.net
          AZURE_SQL_DATABASE: ${{ env.SQL_DATABASE_NAME }}
          AZURE_SQL_USERNAME: sqladmin
          AZURE_SQL_PASSWORD: ${{ secrets.AZURE_SQL_PASSWORD }}

      - name: Verify Database Setup
        run: |
          echo "✓ Database schema setup complete"
          echo "  • Countries table: 1 row"
          echo "  • States table: 36 rows"
          echo "  • Districts table: 13 rows"

  build-and-push-images:
    needs: provision-infrastructure
    runs-on: ubuntu-latest
    outputs:
      orchestrator_image: ${{ steps.images.outputs.orchestrator }}
      retriever_image: ${{ steps.images.outputs.retriever }}
      ingestion_image: ${{ steps.images.outputs.ingestion }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: |
          az acr login --name ${{ env.ACR_NAME }}

      - name: Build and Push Images
        id: images
        run: |
          ACR_SERVER="${{ needs.provision-infrastructure.outputs.acr_login_server }}"
          
          echo "🐳 Building orchestrator..."
          ORCH_IMAGE="${ACR_SERVER}/orchestrator:${{ github.sha }}"
          docker build -t $ORCH_IMAGE agents/orchestrator_agent
          docker push $ORCH_IMAGE
          docker tag $ORCH_IMAGE ${ACR_SERVER}/orchestrator:latest
          docker push ${ACR_SERVER}/orchestrator:latest
          echo "orchestrator=${ORCH_IMAGE}" >> $GITHUB_OUTPUT
          
          echo "🐳 Building retriever..."
          RETR_IMAGE="${ACR_SERVER}/retriever:${{ github.sha }}"
          docker build -t $RETR_IMAGE agents/retriever_agent
          docker push $RETR_IMAGE
          docker tag $RETR_IMAGE ${ACR_SERVER}/retriever:latest
          docker push ${ACR_SERVER}/retriever:latest
          echo "retriever=${RETR_IMAGE}" >> $GITHUB_OUTPUT
          
          echo "🐳 Building ingestion..."
          ING_IMAGE="${ACR_SERVER}/ingestion:${{ github.sha }}"
          docker build -t $ING_IMAGE ingestion
          docker push $ING_IMAGE
          docker tag $ING_IMAGE ${ACR_SERVER}/ingestion:latest
          docker push ${ACR_SERVER}/ingestion:latest
          echo "ingestion=${ING_IMAGE}" >> $GITHUB_OUTPUT

      - name: 🎉 Images Built and Pushed
        run: |
          echo "✅ All Docker images built and pushed to ACR"

  deploy-retriever:
    needs: [provision-infrastructure, setup-database, build-and-push-images]
    runs-on: ubuntu-latest
    outputs:
      retriever_url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get ACR Credentials
        id: acr
        run: |
          ACR_USER=$(az acr credential show --name ${{ env.ACR_NAME }} --query username -o tsv)
          ACR_PASS=$(az acr credential show --name ${{ env.ACR_NAME }} --query passwords[0].value -o tsv)
          echo "username=${ACR_USER}" >> $GITHUB_OUTPUT
          echo "::add-mask::${ACR_PASS}"
          echo "password=${ACR_PASS}" >> $GITHUB_OUTPUT

      - name: Deploy Retriever Container App
        id: deploy
        run: |
          echo "🚀 Deploying Retriever Agent..."
          
          if az containerapp show --name retriever --resource-group ${{ env.AZURE_RESOURCE_GROUP }} 2>/dev/null; then
            echo "Updating existing Container App..."
            az containerapp secret set \
              --name retriever \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --secrets \
                openai-endpoint=${{ needs.provision-infrastructure.outputs.openai_endpoint }} \
                openai-key=${{ needs.provision-infrastructure.outputs.openai_key }} \
                search-endpoint=${{ needs.provision-infrastructure.outputs.search_endpoint }} \
                search-key=${{ needs.provision-infrastructure.outputs.search_key }}

            az containerapp update \
              --name retriever \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --image ${{ needs.build-and-push-images.outputs.retriever_image }} \
              --set-env-vars \
                AZURE_OPENAI_ENDPOINT=secretref:openai-endpoint \
                AZURE_OPENAI_API_KEY=secretref:openai-key \
                AZURE_OPENAI_DEPLOYMENT=gpt-4o \
                AZURE_SEARCH_ENDPOINT=secretref:search-endpoint \
                AZURE_SEARCH_KEY=secretref:search-key \
                AZURE_SEARCH_INDEX=documents
          else
            echo "Creating new Container App..."
            az containerapp create \
              --name retriever \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --environment ${{ env.CONTAINER_ENV }} \
              --image ${{ needs.build-and-push-images.outputs.retriever_image }} \
              --target-port ${{ env.RETRIEVER_PORT }} \
              --ingress external \
              --min-replicas 0 \
              --max-replicas 5 \
              --cpu 0.25 \
              --memory 0.5Gi \
              --registry-server ${{ needs.provision-infrastructure.outputs.acr_login_server }} \
              --registry-username ${{ steps.acr.outputs.username }} \
              --registry-password ${{ steps.acr.outputs.password }} \
              --env-vars \
                AZURE_OPENAI_ENDPOINT=secretref:openai-endpoint \
                AZURE_OPENAI_API_KEY=secretref:openai-key \
                AZURE_OPENAI_DEPLOYMENT=gpt-4o \
                AZURE_SEARCH_ENDPOINT=secretref:search-endpoint \
                AZURE_SEARCH_KEY=secretref:search-key \
                AZURE_SEARCH_INDEX=documents \
              --secrets \
                openai-endpoint=${{ needs.provision-infrastructure.outputs.openai_endpoint }} \
                openai-key=${{ needs.provision-infrastructure.outputs.openai_key }} \
                search-endpoint=${{ needs.provision-infrastructure.outputs.search_endpoint }} \
                search-key=${{ needs.provision-infrastructure.outputs.search_key }}
          fi
          
          URL=$(az containerapp show --name retriever --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query properties.configuration.ingress.fqdn -o tsv)
          echo "url=https://${URL}" >> $GITHUB_OUTPUT
          echo "✓ Retriever deployed: https://${URL}"

  deploy-orchestrator:
    needs: [provision-infrastructure, setup-database, build-and-push-images, deploy-retriever]
    runs-on: ubuntu-latest
    outputs:
      orchestrator_url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get ACR Credentials
        id: acr
        run: |
          ACR_USER=$(az acr credential show --name ${{ env.ACR_NAME }} --query username -o tsv)
          ACR_PASS=$(az acr credential show --name ${{ env.ACR_NAME }} --query passwords[0].value -o tsv)
          echo "username=${ACR_USER}" >> $GITHUB_OUTPUT
          echo "::add-mask::${ACR_PASS}"
          echo "password=${ACR_PASS}" >> $GITHUB_OUTPUT

      - name: Deploy Orchestrator Container App
        id: deploy
        run: |
          echo "🚀 Deploying Orchestrator Agent..."
          
          if az containerapp show --name orchestrator --resource-group ${{ env.AZURE_RESOURCE_GROUP }} 2>/dev/null; then
            echo "Updating existing Container App..."
            az containerapp secret set \
              --name orchestrator \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --secrets \
                openai-endpoint=${{ needs.provision-infrastructure.outputs.openai_endpoint }} \
                openai-key=${{ needs.provision-infrastructure.outputs.openai_key }} \
                sql-server=${{ needs.provision-infrastructure.outputs.sql_server }}.database.windows.net \
                sql-password=${{ secrets.AZURE_SQL_PASSWORD }}

            az containerapp update \
              --name orchestrator \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --image ${{ needs.build-and-push-images.outputs.orchestrator_image }} \
              --set-env-vars \
                AZURE_OPENAI_ENDPOINT=secretref:openai-endpoint \
                AZURE_OPENAI_API_KEY=secretref:openai-key \
                AZURE_OPENAI_DEPLOYMENT=gpt-4o \
                AZURE_SQL_SERVER=secretref:sql-server \
                AZURE_SQL_DATABASE=${{ env.SQL_DATABASE_NAME }} \
                AZURE_SQL_USERNAME=sqladmin \
                AZURE_SQL_PASSWORD=secretref:sql-password \
                RETRIEVER_URL=${{ needs.deploy-retriever.outputs.retriever_url }}
          else
            echo "Creating new Container App..."
            az containerapp create \
              --name orchestrator \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --environment ${{ env.CONTAINER_ENV }} \
              --image ${{ needs.build-and-push-images.outputs.orchestrator_image }} \
              --target-port ${{ env.ORCHESTRATOR_PORT }} \
              --ingress external \
              --min-replicas 1 \
              --max-replicas 10 \
              --cpu 0.5 \
              --memory 1.0Gi \
              --registry-server ${{ needs.provision-infrastructure.outputs.acr_login_server }} \
              --registry-username ${{ steps.acr.outputs.username }} \
              --registry-password ${{ steps.acr.outputs.password }} \
              --env-vars \
                AZURE_OPENAI_ENDPOINT=secretref:openai-endpoint \
                AZURE_OPENAI_API_KEY=secretref:openai-key \
                AZURE_OPENAI_DEPLOYMENT=gpt-4o \
                AZURE_SQL_SERVER=secretref:sql-server \
                AZURE_SQL_DATABASE=${{ env.SQL_DATABASE_NAME }} \
                AZURE_SQL_USERNAME=sqladmin \
                AZURE_SQL_PASSWORD=secretref:sql-password \
                RETRIEVER_URL=${{ needs.deploy-retriever.outputs.retriever_url }} \
              --secrets \
                openai-endpoint=${{ needs.provision-infrastructure.outputs.openai_endpoint }} \
                openai-key=${{ needs.provision-infrastructure.outputs.openai_key }} \
                sql-server=${{ needs.provision-infrastructure.outputs.sql_server }}.database.windows.net \
                sql-password=${{ secrets.AZURE_SQL_PASSWORD }}
          fi
          
          URL=$(az containerapp show --name orchestrator --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query properties.configuration.ingress.fqdn -o tsv)
          echo "url=https://${URL}" >> $GITHUB_OUTPUT
          echo "✓ Orchestrator deployed: https://${URL}"

  upload-documents:
    needs: [provision-infrastructure, deploy-orchestrator]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Upload Documents to Blob Storage
        run: |
          echo "📤 Uploading documents to Azure Blob Storage..."
          STORAGE_NAME=$(az storage account list --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query "[0].name" -o tsv)
          
          az storage blob upload-batch \
            --account-name $STORAGE_NAME \
            --destination documents \
            --source data/sample_docs/ \
            --auth-mode login \
            --overwrite
          
          echo "✓ Documents uploaded: india.md, states.md, districtandplace.md"

  deployment-summary:
    needs: [deploy-orchestrator, upload-documents]
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get Retriever URL
        id: retriever
        run: |
          URL=$(az containerapp show --name retriever --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query properties.configuration.ingress.fqdn -o tsv)
          echo "url=https://${URL}" >> $GITHUB_OUTPUT

      - name: 🎉 Deployment Complete
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ DEPLOYMENT COMPLETED SUCCESSFULLY"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "📦 Deployed Services:"
          echo "   ✓ Azure SQL Database (36 states/UTs)"
          echo "   ✓ Retriever Agent (A2A): ${{ steps.retriever.outputs.url }}"
          echo "   ✓ Orchestrator Agent: ${{ needs.deploy-orchestrator.outputs.orchestrator_url }}"
          echo "   ✓ Sample documents uploaded to Blob Storage"
          echo ""
          echo "🌐 Test Your Deployment:"
          echo "   Open: ${{ needs.deploy-orchestrator.outputs.orchestrator_url }}"
          echo ""
          echo "💡 Try These Questions:"
          echo "   • List all Indian states"
          echo "   • What is the capital of Maharashtra?"
          echo "   • Tell me about India"
          echo "   • What is the culture of Maharashtra?"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
